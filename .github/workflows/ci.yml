name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    # Login shell so setup-miniconda's activate persists into ruff/pytest steps.
    shell: bash -l {0}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: math
          auto-update-conda: true
          conda-remove-defaults: true

      - name: Ruff
        run: ruff check solve/

      - name: Pytest (fast)
        run: pytest -q -m "not slow"
